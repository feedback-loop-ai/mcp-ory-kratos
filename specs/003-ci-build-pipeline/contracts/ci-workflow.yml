# Contract: CI Workflow Configuration
# This is the design contract for the GitHub Actions workflow.
# Implementation should match this structure exactly.
#
# Requirements Traced:
# - FR-001: Trigger on push to any branch
# - FR-002: Run lint, typecheck, test (no integration tests)
# - FR-003: Report status checks to repository
# - FR-006: Complete within 10 minutes
# - FR-008: Parallel execution of independent steps
# - FR-010: Cache dependencies

name: CI

on:
  push:
    branches: ["*"]  # FR-001: any branch
  pull_request:
    branches: [main, "001-kratos-mcp-server"]

# Edge case: force-push cancels in-progress run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.3"  # Pinned for reproducibility

jobs:
  # FR-008: Parallel jobs - lint, typecheck, test run simultaneously

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # FR-010: Cache dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Run Biome lint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Run TypeScript type check
        run: bun x tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # FR-002: Unit tests only (no integration tests requiring Kratos)
      - name: Run unit tests with coverage
        run: bun run test -- --coverage.enabled
        continue-on-error: false  # Tests must pass

      # FR-012: Report coverage (non-blocking, informational)
      - name: Coverage Summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/coverage/coverage-summary.json ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat tests/coverage/coverage-summary.json | jq -r '
              .total |
              "Lines:      \(.lines.pct)% (\(.lines.covered)/\(.lines.total))\n" +
              "Statements: \(.statements.pct)% (\(.statements.covered)/\(.statements.total))\n" +
              "Functions:  \(.functions.pct)% (\(.functions.covered)/\(.functions.total))\n" +
              "Branches:   \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"
            ' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage/
          retention-days: 7
          if-no-files-found: ignore
