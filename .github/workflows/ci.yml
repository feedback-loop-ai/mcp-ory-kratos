# CI Build Pipeline for Validation
# Requirements: FR-001, FR-002, FR-003, FR-006, FR-008, FR-010

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.3"
  KRATOS_VERSION: "v26.2.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun ci
      - name: Run Biome lint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun ci
      - name: Type check (src + tests)
        run: bun run typecheck

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - name: bun audit (high+)
        run: bun audit --audit-level=high

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun ci

      # FR-002: hermetic unit tests only; integration tests run in the job below
      - name: Run unit tests with coverage
        run: bun run test:unit

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/coverage/coverage-summary.json ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .total |
              "Lines:      \(.lines.pct)% (\(.lines.covered)/\(.lines.total))\n" +
              "Statements: \(.statements.pct)% (\(.statements.covered)/\(.statements.total))\n" +
              "Functions:  \(.functions.pct)% (\(.functions.covered)/\(.functions.total))\n" +
              "Branches:   \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"
            ' tests/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: tests/coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration (Kratos ${{ github.event_name == 'pull_request' && 'PR' || 'main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun ci

      - name: Start Kratos
        run: |
          docker compose up -d --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:4434/version

      - name: Run integration tests
        env:
          KRATOS_ADMIN_URL: http://127.0.0.1:4434
          KRATOS_EXPECTED_VERSION: ${{ env.KRATOS_VERSION }}
          KRATOS_AUTH_TYPE: none
        run: bun run test:api

      - name: Kratos logs on failure
        if: failure()
        run: docker compose logs kratos

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kratos-compat-results
          path: tests/test-results.json
          if-no-files-found: ignore
