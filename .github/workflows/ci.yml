# CI Build Pipeline for Validation
# Requirements: FR-001, FR-002, FR-003, FR-006, FR-008, FR-010

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, "001-kratos-mcp-server"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Run Biome lint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Run TypeScript type check
        run: bun x tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # FR-002: Unit tests only (no integration tests requiring Kratos)
      # Integration tests are in tests/api/ and require KRATOS_ADMIN_URL
      # Unit tests should be placed in tests/unit/ when created
      - name: Check for unit tests
        id: check-tests
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.test.ts' 2>/dev/null)" ]; then
            echo "has_unit_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_unit_tests=false" >> $GITHUB_OUTPUT
            echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
            echo "No unit tests found in tests/unit/. Integration tests (tests/api/) are excluded from CI per FR-002." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run unit tests with coverage
        if: steps.check-tests.outputs.has_unit_tests == 'true'
        run: bun x vitest run --config tests/vitest.config.ts --dir tests/unit --coverage.enabled

      - name: Coverage Summary
        if: always() && steps.check-tests.outputs.has_unit_tests == 'true'
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/coverage/coverage-summary.json ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat tests/coverage/coverage-summary.json | jq -r '
              .total |
              "Lines:      \(.lines.pct)% (\(.lines.covered)/\(.lines.total))\n" +
              "Statements: \(.statements.pct)% (\(.statements.covered)/\(.statements.total))\n" +
              "Functions:  \(.functions.pct)% (\(.functions.covered)/\(.functions.total))\n" +
              "Branches:   \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"
            ' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always() && steps.check-tests.outputs.has_unit_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage/
          retention-days: 7
          if-no-files-found: ignore
