# Release Pipeline
# Triggers on version tags to build, validate, and publish to npm
#
# Requirements: FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: "1.3.3"
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Run unit tests
        run: bun x vitest run --config tests/vitest.config.ts --dir tests/unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Verify shebang
        run: |
          if ! head -1 dist/index.js | grep -q "^#!/usr/bin/env node"; then
            echo "ERROR: Missing or incorrect shebang in dist/index.js"
            exit 1
          fi

      - name: Verify package size (< 5MB)
        run: |
          SIZE=$(stat -f%z dist/index.js 2>/dev/null || stat -c%s dist/index.js)
          MAX_SIZE=$((5 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Package size (${SIZE} bytes) exceeds 5MB limit"
            exit 1
          fi
          echo "Package size: ${SIZE} bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Determine dist-tag
        id: dist-tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" =~ -alpha ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" =~ -beta ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" =~ -rc ]]; then
            echo "tag=rc" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # npm >= 11.5 supports Trusted Publishing (OIDC) — no NPM_TOKEN needed once the
      # package is linked to this workflow on npmjs.com. NPM_TOKEN is only a fallback.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 5
          retry_wait_seconds: 10
          # dist/ is the CI-built artifact from the build job; skip prepublishOnly (bun run build)
          # because this runner has Node only.
          command: npm publish --provenance --access public --ignore-scripts --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease=${{ steps.dist-tag.outputs.prerelease }}
