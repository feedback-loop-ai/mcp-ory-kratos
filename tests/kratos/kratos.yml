# Minimal Kratos config for local and CI integration tests.
# Runs with an in-memory SQLite database; `kratos serve --dev` auto-migrates.
version: v26.2.0

dsn: memory

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: false
  admin:
    base_url: http://127.0.0.1:4434/

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  methods:
    password:
      enabled: true
    code:
      enabled: true
    link:
      enabled: true
  flows:
    recovery:
      enabled: true
      use: code

courier:
  smtp:
    connection_uri: smtps://test:test@127.0.0.1:1025/?skip_ssl_verify=true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

log:
  level: warning
  format: json
